<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🤖 Robot Factory Rumble</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #1a1a1a;
    overflow: hidden;
    touch-action: none;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    color: #fff;
  }
  canvas { display: block; cursor: pointer; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Setup ──────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Loop ───────────────────────────────────────────────────────────────────
var lastTime = 0;
function loop(now) {
  var dt = lastTime ? (now - lastTime) / 1000 : 1 / 60;
  if (dt > 0.05) dt = 0.05;
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt) {
  // entity updates land here in subsequent tasks
}
function draw() {
  // Placeholder factory-floor backdrop
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, 0, W, H);
  // Title (proves the loop is running)
  ctx.fillStyle = '#FFEB3B';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🤖 Robot Factory Rumble', W / 2, H / 2);
}
requestAnimationFrame(function(ts) { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🤖 Robot Factory Rumble</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #1a1a1a;
    overflow: hidden;
    touch-action: none;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    color: #fff;
  }
  canvas { display: block; cursor: pointer; image-rendering: pixelated; }
  #hud {
    position: fixed; top: 8px; left: 12px; right: 12px;
    z-index: 5; pointer-events: none;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    align-items: start;
    gap: 4px 12px;
    font-size: 22px; font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,0.85);
  }
  #hearts-row    { grid-column: 1; grid-row: 1; color: #FF1744; }
  #shield-row    { grid-column: 1; grid-row: 2; color: #00E5FF; font-size: 18px; }
  #weapon-label  { grid-column: 2; grid-row: 1; text-align: center; color: #FFEB3B; font-size: 18px; }
  #progress-bar  { grid-column: 3; grid-row: 1; justify-self: end;
                   width: 140px; height: 12px; border: 2px solid rgba(255,255,255,0.5);
                   border-radius: 6px; background: rgba(0,0,0,0.4); overflow: hidden; }
  #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4CAF50, #FFEB3B);
                   transition: width 0.2s; }
  #boss-hp-row {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 5; pointer-events: none;
    width: min(360px, 80vw); text-align: center; font-size: 18px;
  }
  #boss-hp-label { color: #FF5252; margin-bottom: 4px; }
  #boss-hp-bg { width: 100%; height: 14px; background: rgba(0,0,0,0.6);
                border: 2px solid rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden; }
  #boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #FF5252, #FF1744);
                  transition: width 0.25s; }
  #banner {
    position: fixed; top: 30%; left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    z-index: 30; pointer-events: none;
    background: linear-gradient(135deg, #FFEB3B, #FFA726);
    color: #1a1a1a; padding: 14px 28px; border-radius: 22px;
    font-size: 28px; font-weight: bold;
    border: 3px solid #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .ctrl-btn {
    position: fixed; z-index: 4;
    width: 72px; height: 72px;
    background: rgba(20,20,40,0.55);
    border: 3px solid #FFEB3B;
    color: #FFEB3B;
    border-radius: 16px;
    font-size: 30px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .ctrl-btn.pressed, .ctrl-btn:active {
    background: rgba(255,235,59,0.5);
    transform: scale(0.95);
  }
  #ctrl-left  { left: 16px;  bottom: 16px; }
  #ctrl-right { left: 100px; bottom: 16px; }
  #ctrl-jump  { right: 16px; bottom: 16px; }
  #ctrl-aim   { right: 16px; bottom: 100px; font-size: 26px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="hearts-row">♥♥♥♥♥</div>
  <div id="shield-row" style="display:none">▢▢▢▢</div>
  <div id="weapon-label">⚡ Foam Blaster</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="boss-hp-row" style="display:none">
    <div id="boss-hp-label">🤖 FOREMAN-BOT 9000</div>
    <div id="boss-hp-bg"><div id="boss-hp-fill"></div></div>
  </div>
</div>

<div id="ctrl-left"  class="ctrl-btn">◄</div>
<div id="ctrl-right" class="ctrl-btn">▶</div>
<div id="ctrl-jump"  class="ctrl-btn">▲</div>
<div id="ctrl-aim"   class="ctrl-btn">↑</div>

<div id="banner"></div>

<script>
// ── Setup ──────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  FLOOR_Y = H * 0.7;
}
var FLOOR_Y = 0;        // resolved by resize()
resize();
window.addEventListener('resize', resize);

// ── Game state ─────────────────────────────────────────────────────────────
var scene = 'menu';     // 'menu' | 'playing' | 'respawn' | 'win'
scene = 'playing';      // FORCED for Task 4 dev; Task 15 replaces with menu transition
var hp = 5;             // player hearts (0..5)
var maxHp = 5;
var levelLength = 4900; // total horizontal level length in px (per spec)

var heartsEl   = document.getElementById('hearts-row');
var shieldEl   = document.getElementById('shield-row');
var weaponEl   = document.getElementById('weapon-label');
var progressEl = document.getElementById('progress-fill');
var bossRow    = document.getElementById('boss-hp-row');
var bossFill   = document.getElementById('boss-hp-fill');
var bannerEl   = document.getElementById('banner');
var bannerHideTimer = null;

function refreshHud() {
  var s = '';
  for (var i = 0; i < hp; i++) s += '♥';
  for (var j = hp; j < maxHp; j++) s += '♡';
  heartsEl.textContent = s;
}

function showBanner(text, ms) {
  bannerEl.textContent = text;
  bannerEl.classList.add('show');
  if (bannerHideTimer) clearTimeout(bannerHideTimer);
  bannerHideTimer = setTimeout(function() { bannerEl.classList.remove('show'); }, ms || 1400);
}

refreshHud();

// ── Input ──────────────────────────────────────────────────────────────────
var input = {
  leftHeld: false,
  rightHeld: false,
  jumpHeld: false,
  aimUp: false,
  jumpJustPressed: false,
};

function bindBtn(id, key) {
  var btn = document.getElementById(id);
  function press(e) {
    if (e) e.preventDefault();
    btn.classList.add('pressed');
    if (key === 'jumpHeld' && !input.jumpHeld) input.jumpJustPressed = true;
    input[key] = true;
  }
  function release(e) {
    if (e) e.preventDefault();
    btn.classList.remove('pressed');
    input[key] = false;
  }
  btn.addEventListener('pointerdown',   press,   { passive: false });
  btn.addEventListener('pointerup',     release, { passive: false });
  btn.addEventListener('pointercancel', release, { passive: false });
  btn.addEventListener('lostpointercapture', release);
}
bindBtn('ctrl-left',  'leftHeld');
bindBtn('ctrl-right', 'rightHeld');
bindBtn('ctrl-jump',  'jumpHeld');
bindBtn('ctrl-aim',   'aimUp');

window.addEventListener('keydown', function(e) {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') input.leftHeld = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.rightHeld = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!input.jumpHeld) input.jumpJustPressed = true;
    input.jumpHeld = true;
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.aimUp = true;
});
window.addEventListener('keyup', function(e) {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') input.leftHeld = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.rightHeld = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') input.jumpHeld = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.aimUp = false;
});

function clearInput() {
  input.leftHeld = false;
  input.rightHeld = false;
  input.jumpHeld = false;
  input.aimUp = false;
  input.jumpJustPressed = false;
  document.querySelectorAll('.ctrl-btn').forEach(function(b) { b.classList.remove('pressed'); });
}
document.addEventListener('visibilitychange', function() { if (document.hidden) clearInput(); });
window.addEventListener('blur', clearInput);

// ── Constants ──────────────────────────────────────────────────────────────
var WALK_SPEED       = 180;     // px/s
var GRAVITY          = 1800;    // px/s²
var JUMP_IMPULSE     = -700;    // px/s
var JUMP_HOLD_MAX    = 0.20;    // s
var JUMP_HOLD_CUTOFF = 0.45;
var COYOTE_TIME      = 0.08;    // s
// FLOOR_Y is declared up at resize() so the first updatePlayer() sees it correctly.
var INVULN_TIME      = 1.2;     // s after hit

// ── Player ─────────────────────────────────────────────────────────────────
var player = {
  x: 80, y: FLOOR_Y,
  vx: 0, vy: 0,
  w: 36, h: 44,
  hbW: 28, hbH: 36,
  onGround: true,
  coyote: 0,
  jumpHoldT: 0,
  jumping: false,
  facing: 1,
  invuln: 0,
  walkAnim: 0,
};

function updatePlayer(dt) {
  var dir = 0;
  if (scene === 'playing') {
    if (input.rightHeld) dir += 1;
    if (input.leftHeld)  dir -= 1;
  }
  player.vx = dir * WALK_SPEED;
  if (dir !== 0) player.facing = dir;   // remembered for projectile aim direction

  player.vy += GRAVITY * dt;

  if (input.jumpJustPressed && (player.onGround || player.coyote > 0) && scene === 'playing') {
    player.vy = JUMP_IMPULSE;
    player.onGround = false;
    player.coyote = 0;
    player.jumping = true;
    player.jumpHoldT = 0;
  }
  input.jumpJustPressed = false;

  if (player.jumping) {
    player.jumpHoldT += dt;
    if (!input.jumpHeld && player.vy < 0 && player.jumpHoldT < JUMP_HOLD_MAX) {
      player.vy *= JUMP_HOLD_CUTOFF;
      player.jumping = false;
    }
    if (player.jumpHoldT >= JUMP_HOLD_MAX) player.jumping = false;
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  var standY = resolveStandY(player.x + player.w * 0.5);
  // Belt horizontal modifier when standing on a conveyor
  var beltMod = 0;
  for (var pli = 0; pli < level.platforms.length; pli++) {
    var pl = level.platforms[pli];
    if (player.x + player.w * 0.5 >= pl.x && player.x + player.w * 0.5 <= pl.x + pl.w
        && Math.abs(player.y - (GROUND_Y + pl.top)) < 1) {
      beltMod = pl.beltDir * 80;
    }
  }
  player.x += beltMod * dt;

  if (player.y >= standY) {
    if (standY === Infinity) {
      if (player.y > H + 60) onPitFall();
      player.onGround = false;
    } else {
      player.y = standY;
      player.vy = 0;
      if (!player.onGround) {
        player.onGround = true;
        player.coyote = COYOTE_TIME;
      }
    }
  } else {
    player.onGround = false;
    if (player.coyote > 0) player.coyote -= dt;
  }

  if (player.onGround && Math.abs(player.vx) > 0) {
    player.walkAnim += dt * 2.5;
    if (player.walkAnim >= 1) player.walkAnim -= 1;
  } else {
    player.walkAnim = 0;
  }

  if (player.invuln > 0) player.invuln -= dt;
}

function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln * 30) % 2 === 0) return;

  var px = player.x, py = player.y - player.h;
  ctx.fillStyle = '#42A5F5';
  roundRect(px, py, player.w, player.h, 8);
  ctx.fill();
  ctx.fillStyle = '#FFEB3B';
  ctx.fillRect(px + 4, py + 8, player.w - 8, 7);
  ctx.strokeStyle = '#0d3a6b'; ctx.lineWidth = 2;
  roundRect(px, py, player.w, player.h, 8);
  ctx.stroke();
  if (shieldBubble > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(Date.now() / 100);
    ctx.strokeStyle = '#00E5FF';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(px + player.w / 2, py + player.h / 2, player.w * 0.85, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#37474F';
  var legSwap = player.walkAnim < 0.5;
  if (legSwap) {
    ctx.fillRect(px + 5,  py + player.h - 4, 10, 6);
    ctx.fillRect(px + 21, py + player.h,     10, 4);
  } else {
    ctx.fillRect(px + 5,  py + player.h,     10, 4);
    ctx.fillRect(px + 21, py + player.h - 4, 10, 6);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

// ── Camera + level ─────────────────────────────────────────────────────────
var camera = { x: 0 };
function updateCamera() {
  var targetCamX = player.x - W * 0.5;   // center the player
  if (targetCamX < 0) targetCamX = 0;
  if (targetCamX > levelLength - W) targetCamX = Math.max(0, levelLength - W);
  camera.x = targetCamX;
}

var FLOOR_HEIGHT = 80;
var GROUND_Y = 0;       // canvas-y of the ground top; resolved on first draw
var PLATFORM_HEIGHT = 14;
var level = {
  segments: [
    { name: 'A',  x0: 0,    x1: 1800 },
    { name: 'B',  x0: 1800, x1: 4200 },
    { name: 'C',  x0: 4200, x1: 4900 },
  ],
  pits: [
    { x: 600,  w: 70 },
    { x: 1100, w: 80 },
    { x: 1500, w: 70 },
  ],
  platforms: [
    { x: 2100, w: 200, top: -120, beltDir:  1 },
    { x: 2500, w: 220, top: -180, beltDir: -1 },
    { x: 3000, w: 250, top: -120, beltDir:  1 },
  ],
};
function resolveLevelGeometry() {
  GROUND_Y = H - FLOOR_HEIGHT;
  FLOOR_Y  = GROUND_Y;
}

function resolveStandY(px) {
  var candidates = [];
  var overPit = false;
  for (var i = 0; i < level.pits.length; i++) {
    var p = level.pits[i];
    if (px >= p.x && px <= p.x + p.w) { overPit = true; break; }
  }
  if (!overPit) candidates.push(GROUND_Y);
  for (var k = 0; k < level.platforms.length; k++) {
    var pl = level.platforms[k];
    if (px >= pl.x && px <= pl.x + pl.w) candidates.push(GROUND_Y + pl.top);
  }
  if (candidates.length === 0) return Infinity;
  var ystand = Infinity;
  for (var c = 0; c < candidates.length; c++) if (candidates[c] < ystand) ystand = candidates[c];
  return ystand;
}

function onPitFall() {
  hp -= 1;
  refreshHud();
  if (hp <= 0) { onPlayerOut(); return; }
  player.x = lastCheckpoint.x;
  player.y = GROUND_Y;
  player.vy = 0;
  player.invuln = 1.5;
}

// ── Projectiles ────────────────────────────────────────────────────────────
var projectiles = [];      // { x, y, vx, vy, life, kind }
var fireCooldown = 0;
var FOAM_INTERVAL = 0.33;
var FOAM_SPEED    = 600;
var FOAM_RADIUS   = 6;
var weapon = 'foam';
var weaponDuration = 0;
var weaponShotsLeft = 0;

function fireFoam() {
  var f = player.facing;     // +1 = right, -1 = left
  var muzzleX = (f > 0) ? (player.x + player.w) : player.x;
  var muzzleY = player.y - player.h * 0.45;
  var vx = FOAM_SPEED * f, vy = 0;
  if (input.aimUp) {
    var d = Math.SQRT1_2;
    vx = FOAM_SPEED * f * d;
    vy = -FOAM_SPEED * d;
    muzzleX = (f > 0) ? (player.x + player.w * 0.7) : (player.x + player.w * 0.3);
    muzzleY = player.y - player.h * 0.85;
  }
  projectiles.push({ x: muzzleX, y: muzzleY, vx: vx, vy: vy, life: 1.6, kind: 'foam' });
}

function fireWeapon() {
  if (weapon === 'foam') {
    fireFoam();
    fireCooldown = FOAM_INTERVAL;
  } else if (weapon === 'spark') {
    fireSpark();
    fireCooldown = SPARK_INTERVAL;
    weaponShotsLeft -= 3;
  }
}

function fireSpark() {
  var f = player.facing;     // +1 = right, -1 = left
  var muzzleX = (f > 0) ? (player.x + player.w * 0.7) : (player.x + player.w * 0.3);
  var muzzleY = player.y - player.h * 0.5;
  var baseVx = FOAM_SPEED * f, baseVy = 0;
  if (input.aimUp) {
    baseVx = FOAM_SPEED * f * Math.SQRT1_2;
    baseVy = -FOAM_SPEED * Math.SQRT1_2;
  }
  var fanRad = SPARK_FAN_DEG * Math.PI / 360; // half-fan
  for (var k = -1; k <= 1; k++) {
    var ang = fanRad * k;
    var c = Math.cos(ang), s = Math.sin(ang);
    var vx = baseVx * c - baseVy * s;
    var vy = baseVx * s + baseVy * c;
    projectiles.push({ x: muzzleX, y: muzzleY, vx: vx, vy: vy, life: 1.6, kind: 'spark' });
  }
}

function updateProjectiles(dt) {
  if (scene === 'playing' && !vehicle.mounted) {
    fireCooldown -= dt;
    if (fireCooldown <= 0) fireWeapon();
  }
  for (var i = projectiles.length - 1; i >= 0; i--) {
    var p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0 || p.x < camera.x - 50 || p.x > camera.x + W + 50 || p.y > H + 50) {
      projectiles.splice(i, 1);
    }
  }
}

function drawProjectiles() {
  for (var i = 0; i < projectiles.length; i++) {
    var p = projectiles[i];
    if (p.kind === 'foam') {
      ctx.fillStyle = 'rgba(0,229,255,0.35)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, FOAM_RADIUS * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(p.x, p.y, FOAM_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.kind === 'enemy-blob') {
      ctx.fillStyle = '#F06292';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.kind === 'spark') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = '#FFEB3B';
      ctx.beginPath();
      for (var sp = 0; sp < 5; sp++) {
        var a = (sp / 5) * Math.PI * 2 - Math.PI / 2;
        var rOut = sp % 2 === 0 ? 6 : 3;
        ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── Enemies ────────────────────────────────────────────────────────────────
var enemies = [];     // { kind, x, y, vx, hp, w, h, alive, ... per-kind fields }
var bolts   = [];     // K.O. bolt-burst particles: { x, y, vx, vy, life }

function spawnEnemy(kind, x) {
  if (kind === 'walker') {
    enemies.push({
      kind: 'walker', x: x, y: GROUND_Y, w: 32, h: 40,
      vx: -60, hp: 2, alive: true,
      patrolMin: x - 80, patrolMax: x + 80,
      wobbleT: 0,
      contactCool: 0,
    });
  } else if (kind === 'copter') {
    enemies.push({
      kind: 'copter', x: x, y: GROUND_Y - 160, w: 28, h: 24,
      hp: 1, alive: true,
      bobT: Math.random() * 6.28,
      dropT: 1.0,
      contactCool: 0,
    });
  } else if (kind === 'bolt') {
    enemies.push({
      kind: 'bolt', x: x, y: GROUND_Y, w: 24, h: 30,
      hp: 1, alive: true,
      hopT: 0,
      hopDir: -1,
      hopCount: 0,
      homeY: GROUND_Y,
      squashY: 0,
      contactCool: 0,
    });
  }
}

function setupLevelEnemies() {
  // Segment A walkers
  spawnEnemy('walker', 400);
  spawnEnemy('walker', 850);
  spawnEnemy('walker', 1300);
  spawnEnemy('walker', 1650);
  // Segment A copter — triggers Aim Up hint
  spawnEnemy('copter', 1000);
  // Segment B copter
  spawnEnemy('copter', 2700);
  // Segment B bolts
  spawnEnemy('bolt', 2400);
  spawnEnemy('bolt', 3300);
  // Segment B vehicle-stretch cluster
  spawnEnemy('walker', 3700);
  spawnEnemy('walker', 3850);
  spawnEnemy('bolt',   4000);
}

function updateEnemies(dt) {
  for (var i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    if (!e.alive) { enemies.splice(i, 1); continue; }
    if (e.contactCool > 0) e.contactCool -= dt;

    if (e.kind === 'walker') {
      if (e.wobbleT > 0) {
        e.wobbleT -= dt;
      } else {
        e.x += e.vx * dt;
        if (e.x <= e.patrolMin && e.vx < 0) { e.wobbleT = 0.3; e.vx = 60; }
        if (e.x >= e.patrolMax && e.vx > 0) { e.wobbleT = 0.3; e.vx = -60; }
      }
    } else if (e.kind === 'copter') {
      e.bobT += dt * 4;
      e.y = (GROUND_Y - 160) + Math.sin(e.bobT) * 6;
      e.dropT -= dt;
      if (e.dropT <= 0) {
        projectiles.push({
          x: e.x, y: e.y, vx: 0, vy: 200, life: 5,
          kind: 'enemy-blob',
        });
        e.dropT = 2.0;
      }
    } else if (e.kind === 'bolt') {
      e.hopT += dt;
      if (e.hopT < 1.0) {
        // In air: parabolic trajectory
        var t = e.hopT;
        e.x += e.hopDir * 100 * dt;
        // 200px peak at t=0.5, standard parabola
        var peakOffset = 200 * 4 * t * (1 - t);
        e.y = e.homeY - peakOffset;
        e.squashY = -peakOffset / 200;
      } else if (e.hopT < 1.5) {
        // Resting on the ground
        e.y = e.homeY;
        e.squashY = 1;
      } else {
        e.hopT = 0;
        e.hopCount += 1;
        if (e.hopCount >= 4) { e.hopCount = 0; e.hopDir *= -1; }
        e.squashY = 0;
      }
    }

    // Player-contact damage
    if (rectsOverlap(player.x, player.y - player.hbH, player.hbW, player.hbH,
                     e.x - e.w / 2, e.y - e.h, e.w, e.h)) {
      if (vehicle.mounted) {
        if (vehicle.shield > 0 && e.contactCool <= 0) {
          vehicle.shield -= 1;
          e.contactCool = 0.5;
        }
      } else if (player.invuln <= 0 && shieldBubble <= 0) {
        hurtPlayer(1, e.x);
      }
    }

    // Projectile-vs-enemy
    for (var j = projectiles.length - 1; j >= 0; j--) {
      var p = projectiles[j];
      if (p.kind === 'enemy-blob') continue;
      if (p.kind === 'mech-piston') {
        if (rectsOverlap(p.x, p.y - 8, 40, 16, e.x - e.w / 2, e.y - e.h, e.w, e.h)) {
          e.hp -= (p.damage || 1.5);
          if (e.hp <= 0) { e.alive = false; spawnBoltBurst(e.x, e.y - e.h * 0.5); break; }
          // Don't despawn the piston — it lasts 0.2s and can hit multiple enemies
        }
      } else if (p.kind === 'foam' || p.kind === 'spark') {
        if (p.x > e.x - e.w / 2 && p.x < e.x + e.w / 2
            && p.y > e.y - e.h && p.y < e.y) {
          e.hp -= 1;
          projectiles.splice(j, 1);
          if (e.hp <= 0) { e.alive = false; spawnBoltBurst(e.x, e.y - e.h * 0.5); break; }
        }
      }
    }
  }
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function spawnBoltBurst(x, y) {
  for (var i = 0; i < 5; i++) {
    var a = (i / 5) * Math.PI * 2 + Math.random() * 0.4;
    bolts.push({ x: x, y: y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, life: 0.4 });
  }
}

function updateBolts(dt) {
  for (var i = bolts.length - 1; i >= 0; i--) {
    var b = bolts[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += GRAVITY * 0.3 * dt;
    b.life -= dt;
    if (b.life <= 0) bolts.splice(i, 1);
  }
}

function updateEnemyProjectiles(dt) {
  for (var i = projectiles.length - 1; i >= 0; i--) {
    var p = projectiles[i];
    if (p.kind !== 'enemy-blob') continue;
    if (p.x > player.x && p.x < player.x + player.w
        && p.y > player.y - player.h && p.y < player.y) {
      if (vehicle.mounted) {
        if (vehicle.shield > 0) {
          vehicle.shield -= 1;
          projectiles.splice(i, 1);
        }
      } else if (player.invuln <= 0 && shieldBubble <= 0) {
        hurtPlayer(1, p.x);
        projectiles.splice(i, 1);
      }
    } else if (p.y > GROUND_Y) {
      // Hit floor — splat
      projectiles.splice(i, 1);
    }
  }
}

function drawEnemies() {
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (e.kind === 'walker') {
      ctx.save();
      ctx.translate(e.x, e.y - e.h * 0.5);
      // Wobble tilt: peak ±10° at half-telegraph
      if (e.wobbleT > 0) {
        var w = Math.sin((1 - e.wobbleT / 0.3) * Math.PI) * 10 * Math.PI / 180;
        ctx.rotate(e.vx > 0 ? -w : w);
      }
      ctx.fillStyle = '#9E9E9E';
      roundRect(-e.w / 2, -e.h / 2, e.w, e.h, 6);
      ctx.fill();
      ctx.strokeStyle = '#37474F'; ctx.lineWidth = 2;
      roundRect(-e.w / 2, -e.h / 2, e.w, e.h, 6);
      ctx.stroke();
      ctx.fillStyle = '#FF1744';
      ctx.beginPath(); ctx.arc(-6, -8, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( 6, -8, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (e.kind === 'copter') {
      ctx.save();
      ctx.translate(e.x, e.y);
      // Cup base (trapezoid)
      ctx.fillStyle = '#6D4C41';
      ctx.beginPath();
      ctx.moveTo(-e.w / 2, 0);
      ctx.lineTo( e.w / 2, 0);
      ctx.lineTo( e.w / 2 - 4, e.h / 2);
      ctx.lineTo(-e.w / 2 + 4, e.h / 2);
      ctx.closePath();
      ctx.fill();
      // Frosting top
      ctx.fillStyle = '#F8BBD0';
      ctx.beginPath();
      ctx.arc(0, -e.h / 4, e.w / 2, Math.PI, 0);
      ctx.fill();
      // Wings flapping
      var flap = Math.sin(Date.now() / 50) * 4;
      ctx.fillStyle = '#9E9E9E';
      ctx.fillRect(-e.w / 2 - 6, -2 + flap, 6, 3);
      ctx.fillRect( e.w / 2,     -2 + flap, 6, 3);
      ctx.restore();
    } else if (e.kind === 'bolt') {
      ctx.save();
      ctx.translate(e.x, e.y - e.h / 2);
      var sy = 1 + e.squashY * 0.3;
      var sx = 1 - e.squashY * 0.15;
      ctx.scale(sx, sy);
      ctx.fillStyle = '#66BB6A';
      roundRect(-e.w / 2, -e.h / 2, e.w, e.h, 5);
      ctx.fill();
      ctx.strokeStyle = '#1B5E20'; ctx.lineWidth = 2;
      roundRect(-e.w / 2, -e.h / 2, e.w, e.h, 5);
      ctx.stroke();
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath(); ctx.arc(-5, -8, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( 5, -8, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawBolts() {
  for (var i = 0; i < bolts.length; i++) {
    var b = bolts[i];
    ctx.fillStyle = '#9E9E9E';
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  }
}

function hurtPlayer(amount, fromX) {
  hp -= amount;
  refreshHud();
  player.invuln = INVULN_TIME;
  player.vx = (player.x < fromX ? -1 : 1) * 200;
  player.vy = -350;
  if (hp <= 0) onPlayerOut();
}

function onPlayerOut() {
  hp = maxHp;
  refreshHud();
  player.x = lastCheckpoint.x;
  player.y = GROUND_Y;
  player.vy = 0;
  player.invuln = 1.5;
  showBanner('Try again, you\'ve got this!', 1500);
}

// ── Power-ups ──────────────────────────────────────────────────────────────
var pickups = [];        // { kind, x, y, alive }
var shieldBubble = 0;    // s remaining of shield-bubble invuln
var SPARK_INTERVAL = 0.30;
var SPARK_FAN_DEG = 30;
var SPARK_DURATION = 12;
var SPARK_SHOT_LIMIT = 40;

function spawnPickup(kind, x, y) {
  pickups.push({ kind: kind, x: x, y: y === undefined ? GROUND_Y - 20 : y, alive: true });
}

function setupLevelPickups() {
  // Spec: Spark crate end of Seg A; Shield mid-Seg B; Heart before Checkpoint 2
  spawnPickup('spark',  1700);
  spawnPickup('shield', 2900);
  spawnPickup('heart',  4100);
}

function updatePickups(dt) {
  for (var i = pickups.length - 1; i >= 0; i--) {
    var pk = pickups[i];
    if (!pk.alive) { pickups.splice(i, 1); continue; }
    if (rectsOverlap(player.x, player.y - player.hbH, player.hbW, player.hbH,
                     pk.x - 12, pk.y - 24, 24, 24)) {
      pk.alive = false;
      onPickup(pk.kind);
    }
  }
  if (shieldBubble > 0) shieldBubble -= dt;
  if (weapon === 'spark') {
    weaponDuration -= dt;
    if (weaponDuration <= 0 || weaponShotsLeft <= 0) {
      weapon = 'foam';
      weaponEl.textContent = '⚡ Foam Blaster';
    } else {
      weaponEl.textContent = '⚡ Spark · ' + Math.max(0, Math.ceil(weaponDuration)) + 's';
    }
  }
}

function onPickup(kind) {
  if (kind === 'spark') {
    weapon = 'spark';
    weaponDuration = SPARK_DURATION;
    weaponShotsLeft = SPARK_SHOT_LIMIT;
    showBanner('⚡ Spark Spread!', 1500);
  } else if (kind === 'shield') {
    shieldBubble = 6;
    showBanner('🛡 Shield Bubble!', 1500);
  } else if (kind === 'heart') {
    if (hp < maxHp) hp += 1;
    refreshHud();
    showBanner('+1 Heart!', 1500);
  }
}

function drawPickups() {
  for (var i = 0; i < pickups.length; i++) {
    var pk = pickups[i];
    if (!pk.alive) continue;
    var bob = Math.sin(Date.now() / 300 + pk.x * 0.01) * 4;
    var color = pk.kind === 'spark' ? '#FFEB3B' : pk.kind === 'shield' ? '#00E5FF' : '#FF1744';
    var label = pk.kind === 'spark' ? 'SS' : pk.kind === 'shield' ? 'S' : '♥';
    ctx.fillStyle = color;
    ctx.fillRect(pk.x - 12, pk.y - 24 + bob, 24, 24);
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
    ctx.strokeRect(pk.x - 12, pk.y - 24 + bob, 24, 24);
    ctx.fillStyle = '#1A1A1A';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, pk.x, pk.y - 12 + bob);
  }
}

// ── Checkpoints ────────────────────────────────────────────────────────────
var checkpoints = [];        // { x, y, name, touched }
var lastCheckpoint = { x: 80, y: 0 };   // y resolved on first frame

function setupLevelCheckpoints() {
  checkpoints.push({ x: 1780, y: 0, name: '1', touched: false });
  checkpoints.push({ x: 4180, y: 0, name: '2', touched: false });
}

function updateCheckpoints(dt) {
  for (var i = 0; i < checkpoints.length; i++) {
    var c = checkpoints[i];
    if (c.touched) continue;
    if (rectsOverlap(player.x, player.y - player.hbH, player.hbW, player.hbH,
                     c.x - 24, GROUND_Y - 24, 48, 24)) {
      c.touched = true;
      lastCheckpoint = { x: c.x, y: GROUND_Y };
      showBanner('🛟 Saved!', 1200);
    }
  }
}

function drawCheckpoints() {
  for (var i = 0; i < checkpoints.length; i++) {
    var c = checkpoints[i];
    var pulse = 0.4 + 0.5 * (0.5 + 0.5 * Math.sin(Date.now() / 500));
    ctx.fillStyle = c.touched ? 'rgba(76,175,80,' + pulse + ')' : 'rgba(0,229,255,' + pulse + ')';
    ctx.beginPath();
    ctx.arc(c.x, GROUND_Y - 12, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c.touched ? '#4CAF50' : '#00E5FF';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, GROUND_Y - 12, 24, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ── Vehicle ────────────────────────────────────────────────────────────────
var vehicle = {
  x: 3500, y: 0,
  w: 64, h: 56,
  mounted: false,
  shield: 4,
  pistonT: 0,
  pistonCool: 0,
  alive: true,
  promptVisible: false,
};
var BEAM_X = 4200;

function updateVehicle(dt) {
  if (!vehicle.alive) return;
  if (!vehicle.mounted) {
    var near = Math.abs(player.x - vehicle.x) < 36 && player.onGround;
    vehicle.promptVisible = near;
    if (near && input.jumpJustPressed) {
      vehicle.mounted = true;
      vehicle.promptVisible = false;
    }
    return;
  }
  // Mounted: vehicle pins to player x
  vehicle.x = player.x;
  vehicle.pistonCool -= dt;
  if (vehicle.pistonCool <= 0) {
    vehicle.pistonT = 0.4;
    vehicle.pistonCool = 0.5;
    var f = player.facing || 1;
    var pistonX = (f > 0) ? (vehicle.x + vehicle.w + 20) : (vehicle.x - 20 - 40);
    projectiles.push({
      x: pistonX, y: GROUND_Y - vehicle.h * 0.5,
      vx: 0, vy: 0, life: 0.2, kind: 'mech-piston', damage: 1.5, facing: f,
    });
  }
  if (vehicle.pistonT > 0) vehicle.pistonT -= dt;
  // Dismount triggers
  if (player.x >= BEAM_X) {
    vehicle.mounted = false;
    showBanner('🚪 Dismounting!', 800);
  }
  if (vehicle.shield <= 0) {
    vehicle.mounted = false;
    vehicle.alive = false;
    spawnBoltBurst(vehicle.x + vehicle.w / 2, GROUND_Y - vehicle.h / 2);
    spawnBoltBurst(vehicle.x + vehicle.w / 4, GROUND_Y - vehicle.h / 3);
    player.vy = -350;
    player.invuln = 1.5;
    showBanner('Mech down — keep going!', 1200);
  }
}

function drawVehicle() {
  if (!vehicle.alive && !vehicle.mounted) return;
  var vx = vehicle.x, vy = GROUND_Y - vehicle.h;
  ctx.fillStyle = '#FFC107';
  ctx.fillRect(vx, vy, vehicle.w, vehicle.h);
  ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
  ctx.strokeRect(vx, vy, vehicle.w, vehicle.h);
  ctx.fillStyle = '#37474F';
  ctx.beginPath(); ctx.arc(vx + 12, GROUND_Y - 8, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(vx + vehicle.w - 12, GROUND_Y - 8, 10, 0, Math.PI * 2); ctx.fill();
  // Forks (face the direction of travel; default right when not mounted)
  var f = vehicle.mounted ? (player.facing || 1) : 1;
  ctx.fillStyle = '#9E9E9E';
  if (f > 0) {
    ctx.fillRect(vx + vehicle.w, vy + vehicle.h * 0.3, 30, 6);
    ctx.fillRect(vx + vehicle.w, vy + vehicle.h * 0.6, 30, 6);
  } else {
    ctx.fillRect(vx - 30, vy + vehicle.h * 0.3, 30, 6);
    ctx.fillRect(vx - 30, vy + vehicle.h * 0.6, 30, 6);
  }
  // Piston (when extended)
  if (vehicle.pistonT > 0.2) {
    ctx.fillStyle = '#6D4C41';
    if (f > 0) ctx.fillRect(vx + vehicle.w + 30, vy + vehicle.h * 0.42, 40, 16);
    else       ctx.fillRect(vx - 30 - 40,        vy + vehicle.h * 0.42, 40, 16);
  }
  // Antenna LED
  ctx.fillStyle = (Math.floor(Date.now() / 300) % 2) ? '#FFEB3B' : '#9E9E9E';
  ctx.fillRect(vx + vehicle.w / 2 - 1, vy - 12, 2, 12);
  ctx.beginPath(); ctx.arc(vx + vehicle.w / 2, vy - 14, 4, 0, Math.PI * 2); ctx.fill();
  // Mount prompt
  if (vehicle.promptVisible) {
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('↑ Press Jump to ride!', vx + vehicle.w / 2, vy - 28);
  }
}

// ── Loop ───────────────────────────────────────────────────────────────────
var lastTime = 0;
function loop(now) {
  var dt = lastTime ? (now - lastTime) / 1000 : 1 / 60;
  if (dt > 0.05) dt = 0.05;
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt) {
  resolveLevelGeometry();
  updateVehicle(dt);
  updatePlayer(dt);
  updateProjectiles(dt);
  updateEnemyProjectiles(dt);
  updateEnemies(dt);
  updatePickups(dt);
  updateCheckpoints(dt);
  updateBolts(dt);

  // Sync shield HP HUD row
  if (vehicle.mounted) {
    shieldEl.style.display = 'block';
    var s = '';
    for (var ii = 0; ii < vehicle.shield; ii++) s += '▣';
    for (var jj = vehicle.shield; jj < 4; jj++) s += '▢';
    shieldEl.textContent = s;
  } else {
    shieldEl.style.display = 'none';
  }
}
function draw() {
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, 0, W, H);
  resolveLevelGeometry();
  updateCamera();

  ctx.save();
  ctx.translate(-camera.x, 0);
  drawFloor();
  drawPlatforms();
  drawCheckpoints();
  drawVehicle();
  drawPickups();
  drawEnemies();
  drawBolts();
  drawProjectiles();
  drawPlayer();
  ctx.restore();

  var prog = Math.min(1, player.x / levelLength);
  progressEl.style.width = (prog * 100) + '%';
}

function drawFloor() {
  var segs = [{ x0: -50, x1: levelLength + 50 }];
  for (var i = 0; i < level.pits.length; i++) {
    var p = level.pits[i];
    var newSegs = [];
    for (var j = 0; j < segs.length; j++) {
      var s = segs[j];
      if (p.x + p.w < s.x0 || p.x > s.x1) { newSegs.push(s); continue; }
      if (p.x > s.x0)        newSegs.push({ x0: s.x0, x1: p.x });
      if (p.x + p.w < s.x1)  newSegs.push({ x0: p.x + p.w, x1: s.x1 });
    }
    segs = newSegs;
  }
  ctx.fillStyle = '#5D3A1A';
  for (var k = 0; k < segs.length; k++) {
    ctx.fillRect(segs[k].x0, GROUND_Y, segs[k].x1 - segs[k].x0, FLOOR_HEIGHT);
  }
  ctx.fillStyle = '#FFEB3B';
  for (var m = 0; m < segs.length; m++) {
    ctx.fillRect(segs[m].x0, GROUND_Y, segs[m].x1 - segs[m].x0, 3);
  }
  ctx.fillStyle = '#FF1744';
  for (var p2 = 0; p2 < level.pits.length; p2++) {
    var pp = level.pits[p2];
    ctx.fillRect(pp.x - 2, GROUND_Y, 2, FLOOR_HEIGHT);
    ctx.fillRect(pp.x + pp.w, GROUND_Y, 2, FLOOR_HEIGHT);
  }
}

function drawPlatforms() {
  for (var i = 0; i < level.platforms.length; i++) {
    var pl = level.platforms[i];
    var py = GROUND_Y + pl.top;
    ctx.fillStyle = '#37474F';
    ctx.fillRect(pl.x, py, pl.w, PLATFORM_HEIGHT);
    ctx.fillStyle = '#FFEB3B';
    var phase = (Date.now() / (pl.beltDir > 0 ? -120 : 120)) % 12;
    if (phase < 0) phase += 12;
    for (var d = -12 + phase; d < pl.w; d += 12) {
      var x0 = pl.x + d, x1 = pl.x + d + 8;
      var clipL = Math.max(pl.x, x0), clipR = Math.min(pl.x + pl.w, x1);
      if (clipR > clipL) ctx.fillRect(clipL, py + 4, clipR - clipL, 6);
    }
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
    ctx.strokeRect(pl.x, py, pl.w, PLATFORM_HEIGHT);
  }
}
resolveLevelGeometry();
setupLevelEnemies();
setupLevelPickups();
setupLevelCheckpoints();
requestAnimationFrame(function(ts) { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
